interface:
  display_name: "Module Repository"
  short_description: "Create an aggregate repository contract from the shared persistence interfaces, plus an in-memory fake for use case tests"
  default_prompt: "Create the repository contract of an aggregate inside an existing module in modules/<module>: confirm the module, the aggregate (name or explicit provider path), the type (crud or custom), the entity and, for custom, the list of methods with their signatures or intent. Read the shared contracts in packages/shared/src/db, the auth User repository, entity and in-memory fake, map each requested operation to CrudRepository or the granular shared contracts, run scripts/scaffold-repository.mjs to generate provider/<aggregate>.repository.ts, the export chain, the in-memory fake in test/mock (fake-<aggregate>.repository.ts, or the module's existing mock convention), its test and test/mock/index.ts, resolve every TODO(module-repository) marker, then run scripts/verify-repository.mjs until the module compiles, the fake has 100% coverage and the module suite passes. Do not implement real persistence, Prisma, controllers or business rules."
