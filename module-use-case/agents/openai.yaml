interface:
  display_name: "Module Use Case"
  short_description: "Create a standardized aggregate use case with In/Out contracts, a simple first implementation and unit tests at 100% coverage over in-memory fakes"
  default_prompt: "Create a use case of an aggregate inside an existing module in modules/<module>: confirm the module, the aggregate (name or explicit usecase path), the use case name, the scenario (crud: create, update, delete, find-by-id, find-page; or custom) and whether it returns data, plus the dependencies, input/output fields and explicit rules when given. Read the auth RegisterUser use case, its index and test, the auth test/mock fakes and index, and the shared UseCase contract, then run scripts/scaffold-usecase.mjs to generate src/<aggregate>/usecase/<name>.usecase.ts (class without the UseCase suffix, <Name>In, <Name>Out or void), the export chain and test/<aggregate>/usecase/<name>.usecase.test.ts, reusing existing fakes and creating a simple fake only when a dependency has none. Resolve every TODO(module-use-case) marker without inventing business rules, then run scripts/verify-usecase.mjs until the module compiles, the use case has 100% coverage and the module suite passes. Do not create controllers, Prisma code or backend adapters."
